spring:
  application:
    name: hrGuard
  profiles:
    active: dev

  datasource:
    meta:
      hikari:
        pool-name: hrguard-meta
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${DB_HOST:localhost}:3306/meta?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:1234}
    domain:
      hikari:
        pool-name: hrguard-domain
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${DB_HOST:localhost}:3306/${DOMAIN_DB:autohrm}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useCursorFetch=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:1234}
        auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

batch:
  payroll:
    # Skip 한도. 초과 시 SkipLimitExceededException 으로 Job 강제 종료.
    skip-limit: 100
    retry:
      # 일시적 DB 오류(deadlock 등) 재시도 횟수
      limit: 3
      # Exponential backoff: initial → initial × multiplier 씩 증가, max 까지 상한
      backoff:
        initial-ms: 1000
        multiplier: 2.0
        max-ms: 30000

holiday:
  api:
    service-key: ${HOLIDAY_API_KEY:}

logging:
  level:
    root: INFO
    dev:
      batch: INFO
      # 메모리 톱니 패턴 추적용 별도 logger — 평소 OFF, 메모리 조사 시만 INFO 로 켬
      batch.heap: WARN
    org:
      hibernate:
        type:
          descriptor.sql: trace
        engine.jdbc.spi.SqlExceptionHelper: WARN
    com:
      amazonaws:
        util:
          EC2MetadataUtils: error

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        hikaricp.connections.acquire: true
